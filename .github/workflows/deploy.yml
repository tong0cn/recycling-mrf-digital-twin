# 推到 main 即自动构建并发布到 GitHub Pages。
# 站点地址：https://yuhaoxiong.github.io/recycling-mrf-digital-twin/
#
# 为什么先 build 再 test：tests/dist.test.ts 会检查 dist/ 里的发布产物是否自包含，
# 先构建才能让那组断言真正执行（缺 dist 时它们会被 skipIf 静默跳过）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建与验收
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 准备 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（严格按 lock 文件）
        run: npm ci

      - name: 构建静态产物
        run: npm run build

      - name: 构建实际产线并保留原演示入口
        run: npm run build:actual

      - name: 运行测试（含发布产物自包含校验）
        run: npm test

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-actual

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<header><div><h1>桐乡分拣线 <span class="muted">/ CAD 布局核查</span></h1><small>真实装配几何 · 42 个顶层实例 · 17 个核心设备职责已确认</small></div><small>原始 STEP 保持不变 · 本地预览</small></header>
<main><section id="viewport"><div class="toolbar"><button id="fit">全景</button><button id="process">工艺区</button><button id="top">俯视</button><button id="isolate">单独查看</button><button id="shell">显示厂房</button><button id="numbers">编号开关</button></div><div id="labels"></div><div id="status">正在加载轻量化 CAD，请稍候…</div></section><aside><div id="detail">点击模型或设备清单，查看独立实例的名称与尺寸。<p class="muted">拖动旋转 · 滚轮缩放 · 右键平移<br>本页核查空间布局，尚未加入运行与物料动画。</p></div><h2>装配实例清单</h2><div id="list"></div></aside></main>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const container=document.querySelector('#viewport'),status=document.querySelector('#status'),list=document.querySelector('#list');
const scene=new THREE.Scene();scene.background=new THREE.Color('#cbd4d9');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor('#cbd4d9');container.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(38,1,0.01,1000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x65727c,2.5));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(20,35,15);scene.add(sun);
let model,inventory,processNames={},selected=null,isolated=false,labelsVisible=false,shellVisible=false,scopeFull=false,fullBox,processBox;const roots=new Map(),buttons=new Map(),labels=new Map();
const boxHelper=new THREE.Box3Helper(new THREE.Box3(),0x008f81);boxHelper.visible=false;scene.add(boxHelper);
function resize(){const w=container.clientWidth,h=container.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(container);resize();
function fit(box,top=false){const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const radius=size.length()/2;const distance=radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))/Math.min(1,camera.aspect)*1.08;controls.target.copy(center);camera.position.copy(center).addScaledVector(top?new THREE.Vector3(0,1,0.0001):new THREE.Vector3(1,0.9,1.1).normalize(),distance);camera.near=Math.max(0.01,distance/10000);camera.far=Math.max(1000,distance*20);camera.updateProjectionMatrix();controls.update()}
function select(id){selected=id;for(const [key,button] of buttons)button.classList.toggle('active',key===id);const row=inventory.top_level.find(x=>x.id===id);const detail=document.querySelector('#detail');detail.replaceChildren();const title=document.createElement('strong');title.textContent=`${id} · ${processNames[id]||row.name}`;detail.append(title);const info=document.createElement('p');info.textContent=`包围尺寸（CAD轴 X / Y / Z）：${row.size_mm.map(n=>(n/1000).toFixed(2)).join(' × ')} m`;detail.append(info);const note=document.createElement('small');note.textContent=processNames[id]?`工艺职责已由用户确认。CAD 原名：${row.name}`:'名称来自 STEP 装配；流程职责尚未人工确认。';detail.append(note);const object=roots.get(id);boxHelper.visible=!!object;if(object)boxHelper.box.copy(new THREE.Box3().setFromObject(object));if(isolated)applyIsolation()}
function applyIsolation(){for(const [id,object] of roots)object.visible=isolated?id===selected:(id!=='E01'||shellVisible);if(selected&&isolated&&roots.has(selected))fit(new THREE.Box3().setFromObject(roots.get(selected)));document.querySelector('#isolate').textContent=isolated?'显示全部':'单独查看'}
document.querySelector('#fit').onclick=()=>{if(model){scopeFull=true;isolated=false;applyIsolation();fit(fullBox)}};document.querySelector('#top').onclick=()=>{if(model)fit(isolated&&selected?new THREE.Box3().setFromObject(roots.get(selected)):(scopeFull?fullBox:processBox),true)};document.querySelector('#isolate').onclick=()=>{if(selected){isolated=!isolated;applyIsolation()}};document.querySelector('#numbers').onclick=()=>{labelsVisible=!labelsVisible};
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down;
document.querySelector('#process').onclick=()=>{if(model){scopeFull=false;isolated=false;applyIsolation();fit(processBox)}};document.querySelector('#shell').onclick=()=>{shellVisible=!shellVisible;applyIsolation();document.querySelector('#shell').textContent=shellVisible?'隐藏厂房':'显示厂房'};
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!model||!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);for(const hit of raycaster.intersectObject(model,true)){let object=hit.object;while(object&&!/^E\d{2}$/.test(object.name))object=object.parent;if(object&&object.visible){select(object.name);break}}});
try{inventory=await fetch('./inventory.json').then(r=>{if(!r.ok)throw Error('清单读取失败');return r.json()});processNames=await fetch('../../scripts/cad-process.json').then(r=>{if(!r.ok)throw Error('已确认工艺映射读取失败');return r.json()}).then(data=>data.equipment);const gltf=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('./plant-review.glb',e=>{if(e.total)status.textContent=`模型加载 ${Math.round(e.loaded/e.total*100)}%`});model=gltf.scene;
// Compare exported extents against CAD extents instead of assuming the writer's axis defaults.
// This assembly uses source Y-up; its export already preserves that orientation.
const ground=inventory.top_level.find(r=>r.name.includes('地面'));const sourceUp=ground?ground.size_mm.indexOf(Math.min(...ground.size_mm)):1;const expectedHeight=(inventory.bounds_mm[sourceUp+3]-inventory.bounds_mm[sourceUp])/1000;const measured=new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());if(Math.abs(measured.z-expectedHeight)<Math.abs(measured.y-expectedHeight))model.rotation.x=sourceUp===1?Math.PI/2:-Math.PI/2;
scene.add(model);model.updateMatrixWorld(true);model.traverse(o=>{if(/^E\d{2}$/.test(o.name)&&!roots.has(o.name))roots.set(o.name,o)});
for(const row of inventory.top_level){const button=document.createElement('button'),code=document.createElement('span');code.className='code';code.textContent=row.id;button.append(code,document.createTextNode(processNames[row.id]||row.name));button.onclick=()=>select(row.id);list.append(button);buttons.set(row.id,button);const object=roots.get(row.id);if(object){const label=document.createElement('span');label.className='label';label.textContent=row.id;document.querySelector('#labels').append(label);labels.set(row.id,{element:label,object,center:new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3())})}}
fullBox=new THREE.Box3().setFromObject(model);processBox=new THREE.Box3();for(const [id,object] of roots){const n=Number(id.slice(1));if(n>=2&&n<=18)processBox.union(new THREE.Box3().setFromObject(object))}applyIsolation();fit(processBox);const grid=new THREE.GridHelper(Math.ceil(fullBox.getSize(new THREE.Vector3()).length()),40,0x82939c,0xb3bfc5);grid.position.y=fullBox.min.y-0.02;scene.add(grid);status.textContent=`已加载 ${roots.size}/${inventory.top_level.length} 个编号装配 · 原始名称与实例独立保留`;window.cadReview={inventory,roots,scene,renderer,camera,controls,select,fit,fullBox,processBox};
}catch(error){status.textContent=`加载失败：${error.message}。请通过本地 HTTP 服务打开本页。`;console.error(error)}
const point=new THREE.Vector3();renderer.setAnimationLoop(()=>{controls.update();for(const [id,{element,object,center}] of labels){element.hidden=!labelsVisible||!object.visible||(Number(id.slice(1))>18&&id!=='E25'&&id!==selected);if(!element.hidden){point.copy(center).project(camera);element.hidden=point.z>1||point.z< -1;element.style.left=`${(point.x+1)*container.clientWidth/2}px`;element.style.top=`${(1-point.y)*container.clientHeight/2}px`}}renderer.render(scene,camera)});
</script></html>
